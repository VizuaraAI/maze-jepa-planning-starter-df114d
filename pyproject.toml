[project]
name = "mazeplan"
version = "0.1.0"
description = "Planning in mazes from reward-free play with a LeWorldModel-style JEPA"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
